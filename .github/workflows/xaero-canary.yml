# Runs the runtime Xaero compatibility check against the newest Xaero's World Map release every
# day and opens an issue when Seed Atlas would switch itself off with it.
name: xaero-canary
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download the newest Xaero's World Map release
        id: xaero
        shell: bash
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          built=$(sed -n 's/^xaero_world_map_version=//p' gradle.properties)
          base="https://chocolateminecraft.com/maven/xaero/map/xaeroworldmap-${{ matrix.loader }}-$mc"
          latest=$(curl -fsSL "$base/maven-metadata.xml" | grep -o '<version>[^<]*</version>' \
            | sed 's/<[^>]*>//g' | sort -V | tail -1)
          echo "Seed Atlas is built against $built; newest ${{ matrix.loader }} release is $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          curl -fsSL -o "$RUNNER_TEMP/xaero.jar" "$base/$latest/xaeroworldmap-${{ matrix.loader }}-$mc-$latest.jar"
      - name: Check Seed Atlas against it
        shell: bash
        run: |
          if [ "${{ matrix.loader }}" = "fabric" ]; then
            bash ./gradlew xaeroCompatibilityTest -PxaeroCompatJar="$RUNNER_TEMP/xaero.jar"
          else
            cd "${{ matrix.loader }}"
            bash ./gradlew xaeroCompatibilityTest -PxaeroCompatJar="$RUNNER_TEMP/xaero.jar"
          fi
      - name: Open an issue for an incompatible release
        if: failure() && steps.xaero.outputs.latest != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Xaero's World Map ${{ steps.xaero.outputs.latest }} (${{ matrix.loader }}) disables Seed Atlas"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body \
              "The daily Xaero canary found that Seed Atlas would turn itself off with this Xaero release. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
